# The index scripts' own checks: lint, schemas up to date, tests (with SAEngine's validator).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: The-Studio-of-Sadiq/SAEngine
          ref: feat/ui-ux-redesign
          path: .saengine
          filter: blob:none
          sparse-checkout: python/src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check --line-length 100 scripts tests
      - run: ruff format --check --line-length 100 scripts tests
      - name: Schemas match the models
        run: python scripts/index_model.py --check
      - name: Tests
        env:
          SAENGINE_CHECKOUT: .saengine
        run: python -m pytest -q tests
